<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hello World</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4efe6;
        --panel: rgba(255, 255, 255, 0.8);
        --text: #1f2937;
        --accent: #0f766e;
        --shadow: 0 20px 60px rgba(15, 23, 42, 0.12);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, #f9dcb7 0, transparent 30%),
          radial-gradient(circle at bottom right, #b8e3dd 0, transparent 28%),
          var(--bg);
      }
      .card {
        width: min(680px, calc(100vw - 32px));
        padding: 40px;
        border-radius: 28px;
        background: var(--panel);
        backdrop-filter: blur(12px);
        box-shadow: var(--shadow);
        border: 1px solid rgba(255, 255, 255, 0.7);
        text-align: center;
      }
      .eyebrow {
        margin: 0 0 12px;
        font-size: 0.9rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--accent);
        font-weight: 700;
      }
      h1 { margin: 0; font-size: clamp(3rem, 8vw, 5.5rem); line-height: 0.95; }
      p { margin: 18px auto 0; max-width: 34rem; font-size: 1.05rem; line-height: 1.7; }
      button {
        margin-top: 28px;
        padding: 12px 20px;
        border: 0;
        border-radius: 999px;
        color: white;
        background: linear-gradient(135deg, #0f766e, #115e59);
        font-size: 1rem;
        cursor: pointer;
        box-shadow: 0 12px 24px rgba(15, 118, 110, 0.28);
      }
      button:hover { transform: translateY(-1px); }
      .status { margin-top: 18px; min-height: 1.5em; font-size: 0.98rem; color: #374151; }
      .meta { margin-top: 14px; font-size: 0.92rem; color: #6b7280; }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">Local Web Server</p>
      <h1>Hello World</h1>
      <p>นี่คือเว็บที่เสิร์ฟจากเครื่องของคุณผ่าน server จริง และมีฐานข้อมูลจำลองเก็บข้อมูลไว้ในเครื่องด้วย</p>
      <button id="btn">กดทักทาย</button>
      <div id="status" class="status"></div>
      <div id="meta" class="meta"></div>
    </main>
    <script>
      const btn = document.getElementById("btn");
      const status = document.getElementById("status");
      const meta = document.getElementById("meta");

      async function loadInfo() {
        const res = await fetch("/api/status");
        const data = await res.json();
        meta.textContent = `Server: ${data.serverTime} | Messages stored: ${data.messageCount}`;
      }

      btn.addEventListener("click", async () => {
        const res = await fetch("/api/hello", { method: "POST" });
        const data = await res.json();
        status.textContent = data.message;
        await loadInfo();
      });

      loadInfo().catch(() => {
        meta.textContent = "ไม่สามารถติดต่อ server ได้";
      });
    </script>
  </body>
</html>
